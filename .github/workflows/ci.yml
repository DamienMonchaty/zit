name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The tests make commits in throwaway repositories.
      - run: |
          git config --global user.name "Zit CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: zig build
      - run: zig build test --summary all
        env:
          SDL_VIDEODRIVER: dummy

  windows:
    name: Windows — build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The test suite drives `sh`, so on Windows the check is that Zit builds.
      - run: zig build
