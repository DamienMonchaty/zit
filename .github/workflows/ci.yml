name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        env:
          ZIG: "0.17.0"
          SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG/zig-x86_64-linux-$ZIG.tar.xz" -o zig.tar.xz
          echo "$SHA  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-linux-${{ hashFiles('build.zig.zon') }}
      # The tests make commits in throwaway repositories.
      - run: |
          git config --global user.name "Zit CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: zig build
      - run: zig build test --summary all
        env:
          SDL_VIDEODRIVER: dummy

  # The suite again without the safety checks, beside the one above rather
  # than after it: undefined behaviour ReleaseSafe traps on runs on in
  # ReleaseFast, and shows as a wrong answer or a crash only there — the
  # tests in ReleaseSafe would never see it.
  linux-release-fast:
    name: Linux — tests in ReleaseFast
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        env:
          ZIG: "0.17.0"
          SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG/zig-x86_64-linux-$ZIG.tar.xz" -o zig.tar.xz
          echo "$SHA  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-linux-release-fast-${{ hashFiles('build.zig.zon') }}
      - run: |
          git config --global user.name "Zit CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: zig build test -Doptimize=fast --summary all
        env:
          SDL_VIDEODRIVER: dummy

  windows:
    name: Windows — build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        env:
          ZIG: "0.17.0"
          SHA: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
        run: |
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG/zig-x86_64-windows-$env:ZIG.zip" -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne $env:SHA) { throw "Zig's checksum does not match" }
          Expand-Archive zig.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-x86_64-windows-$env:ZIG" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\zig
          key: zig-windows-${{ hashFiles('build.zig.zon') }}
      # The test suite drives `sh`, so on Windows the check is that Zit builds.
      - run: zig build
