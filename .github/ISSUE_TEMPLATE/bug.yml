name: Bug
description: Something in Zit does not work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Zit version
      description: Shown at the bottom right of the window.
      placeholder: v0.1.2
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 10
        - Windows 11
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: An error message, a screenshot, or a crash log if there is one.
    validations:
      required: true
